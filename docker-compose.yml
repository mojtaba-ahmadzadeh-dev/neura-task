services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: neura-task-app

    restart: unless-stopped

    ports:
      - "4000:3000"

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - neura-network


  mysql:
    image: mysql:8.4

    container_name: neura-task-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: neura-task

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - neura-network


  redis:
    image: redis:7-alpine

    container_name: neura-task-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

    networks:
      - neura-network


volumes:
  mysql_data:
  redis_data:


networks:
  neura-network:
    name: neura-network
    driver: bridge